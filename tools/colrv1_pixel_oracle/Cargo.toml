[package]
name = "colrv1-pixel-oracle"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# This follows the same pinned local Fontations checkout as the repository's
# metadata/outline oracle. Keeping it a path dependency makes the normal Zig
# build independent of Cargo and the network.
skrifa = { path = "../../../../Work/fontations/skrifa", default-features = false, features = ["std"] }
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std"] }
