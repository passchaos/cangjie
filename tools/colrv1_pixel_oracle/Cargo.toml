[package]
name = "colrv1-pixel-oracle"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# Skrifa 0.45.2 was not published on crates.io. Pin both the exact upstream
# revision and its declared version so every checkout uses the reviewed source.
skrifa = { git = "https://github.com/googlefonts/fontations", rev = "bb6f87166aa8bac93ff9df5ea67d58b7091b3e2a", version = "=0.45.2", default-features = false, features = ["std"] }
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std"] }
